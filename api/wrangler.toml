name = "pass-the-world"
main = "src/cloudflare/worker.ts"
compatibility_date = "2026-06-01"

# Served on a custom domain in the Cloudflare zone, instead of <name>.<subdomain>.workers.dev.
routes = [{ pattern = "passtheworld.skrewt.dev", custom_domain = true }]
workers_dev = false

# The website (built by `pnpm --filter site build`) is served as static assets.
# Requests that don't match a file (i.e. /api/*) fall through to the worker.
[assets]
directory = "../site/dist"

[vars]
# Production values. For local development, .dev.vars overrides these (see .dev.vars.example).
ENVIRONMENT = "production" # "dev" enables /api/auth/dev-login
SITE_URL = "https://passtheworld.skrewt.dev"
API_URL = "https://passtheworld.skrewt.dev/api"
MAX_SNAPSHOT_MB = "64"

# Secrets (`wrangler secret put NAME`, or .dev.vars locally):
#   DISCORD_CLIENT_ID
#   DISCORD_CLIENT_SECRET

[[d1_databases]]
binding = "DB"
database_name = "pass-the-world"
database_id = "9acbd93c-96a7-4efd-bf45-1dc1fb703c46"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SAVES"
bucket_name = "pass-the-world-saves"

# Expire overdue turns and auto-skip no-shows.
[triggers]
crons = ["*/5 * * * *"]
