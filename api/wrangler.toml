name = "pass-the-world"
main = "src/cloudflare/worker.ts"
compatibility_date = "2026-06-01"

# The website (built by `pnpm --filter site build`) is served as static assets.
# Requests that don't match a file (i.e. /api/*) fall through to the worker.
[assets]
directory = "../site/dist"

[vars]
ENVIRONMENT = "dev" # "dev" enables /api/auth/dev-login. Use "production" when deployed.
SITE_URL = "http://localhost:5173" # Deployed: https://pass-the-world.<you>.workers.dev (or your domain)
API_URL = "http://localhost:8787/api" # Deployed: <SITE_URL>/api
MAX_SNAPSHOT_MB = "64"

# Secrets (`wrangler secret put NAME`, or .dev.vars locally):
#   DISCORD_CLIENT_ID
#   DISCORD_CLIENT_SECRET

[[d1_databases]]
binding = "DB"
database_name = "pass-the-world"
database_id = "00000000-0000-0000-0000-000000000000" # replace after `wrangler d1 create pass-the-world`
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SAVES"
bucket_name = "pass-the-world-saves"

# Expire overdue turns and auto-skip no-shows.
[triggers]
crons = ["*/5 * * * *"]
