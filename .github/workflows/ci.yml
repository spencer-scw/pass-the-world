# Checks every pull request and push to main. A push to main (i.e. a merged PR) that passes the checks is
# deployed to Cloudflare: database migrations first, then the site and the API together.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # re-run a deploy by hand from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm test # includes the generated-client drift check
      - run: pnpm --filter site build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time; a newer merge waits for the running deploy rather than cancelling it mid-migration.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm --filter api db:migrate:remote
      - name: Deploy site and API
        run: pnpm --filter api run deploy
